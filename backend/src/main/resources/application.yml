server:
  port: 8081
  max-http-request-header-size: 16KB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

spring:
  application:
    name: android-doctor
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/android-doctor};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:9090}
  max-log-chars: 1000000
  history-limit: 100
  rate-limit-per-minute: 30
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen2.5-coder:7b}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    max-input-chars: 24000
    master-key-path: ${AI_MASTER_KEY_PATH:}
  admin:
    password: ${APP_ADMIN_PASSWORD:}
    password-file: ${APP_ADMIN_PASSWORD_FILE:}
    session-hours: ${APP_ADMIN_SESSION_HOURS:8}

logging:
  level:
    root: INFO
    com.androiddoctor: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n"

